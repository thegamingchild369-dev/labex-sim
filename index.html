<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabEx Sim</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #111;
        }

        #screen-root {
            width: 100vw;
            height: 100vh;
        }

        #menu-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #111;
            color: white;
            z-index: 10;
        }

        #menu-screen h1 {
            font-size: 64px;
            margin: 0 0 40px;
        }

        #menu-form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #play {
            font-size: 28px;
            padding: 15px 60px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #play:hover {
            background: #ddd;
        }

        #username {
            font-size: 20px;
            padding: 12px;
            margin-bottom: 20px;
            width: 280px;
            text-align: center;
        }

        #game-screen,
        #game-canvas {
            width: 100%;
            height: 100%;
        }

        #connection-status {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 12px;
            z-index: 5;
        }

        #screen-error {
            padding: 24px;
            color: #fff;
            white-space: pre-wrap;
        }
    </style>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
    </script>
</head>
<body>
    <main id="screen-root"></main>
    <script type="module" src="./app.js"></script>
</body>
</html>
