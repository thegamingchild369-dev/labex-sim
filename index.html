<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabEx Sim</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #111;
        }

        #screen-root {
            width: 100vw;
            height: 100vh;
        }

        #menu-background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background: linear-gradient(#173454, #91b6c4);
        }

        #menu-background canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #menu-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 24px;
            overflow-y: auto;
            background: rgba(10, 18, 29, 0.4);
            color: white;
            z-index: 10;
        }

        #menu-screen h1 {
            font-size: clamp(42px, 7vw, 72px);
            margin: 0;
            text-shadow: 0 3px 14px rgba(0, 0, 0, 0.7);
        }

        #menu-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: min(100%, 440px);
        }

        #assigned-username,
        .menu-button {
            font: inherit;
            font-size: 18px;
            padding: 12px 16px;
            border: 0;
            border-radius: 7px;
        }

        #assigned-username {
            margin: 0;
            text-align: center;
            text-shadow: 0 1px 4px #000;
        }

        #username-display {
            color: #f0c75e;
        }

        .menu-button {
            cursor: pointer;
            font-weight: 700;
        }

        .menu-button:disabled {
            cursor: wait;
            opacity: 0.6;
        }

        #play {
            width: 100%;
            font-size: 24px;
            padding: 14px 20px;
        }

        #create-room {
            background: #f0c75e;
        }

        #room-browser {
            width: min(100%, 440px);
            max-height: 34vh;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 16px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.62);
        }

        #room-browser h2 {
            margin: 0;
            font-size: 20px;
        }

        #room-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
        }

        .room-entry {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
        }

        .room-info {
            min-width: 0;
        }

        .room-name {
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .room-count,
        #menu-status,
        #menu-error,
        #room-empty {
            font-size: 14px;
        }

        #menu-status {
            text-shadow: 0 1px 4px #000;
        }

        #menu-error {
            min-height: 1em;
            color: #ffd0c9;
        }

        #room-empty {
            margin: 4px 0;
            opacity: 0.85;
        }

        #refresh-rooms {
            align-self: flex-start;
            padding: 7px 12px;
            font-size: 14px;
            background: #e5e5e5;
        }

        #play:hover,
        #refresh-rooms:hover,
        .room-entry button:hover,
        #create-room:hover {
            filter: brightness(0.92);
        }

        #room-browser .room-entry button {
            flex: 0 0 auto;
            padding: 7px 12px;
            font-size: 14px;
            background: white;
        }

        #play {
            border: none;
        }

        #game-screen,
        #game-canvas {
            width: 100%;
            height: 100%;
        }

        #connection-status {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 12px;
            z-index: 5;
        }

        #admin-camera-toggle {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 6;
            padding: 9px 12px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }

        #admin-camera-toggle[hidden] {
            display: none;
        }

        #admin-camera-status {
            position: fixed;
            top: 54px;
            right: 10px;
            z-index: 6;
            max-width: min(320px, calc(100vw - 20px));
            color: white;
            text-align: right;
            text-shadow: 0 1px 4px #000;
        }

        #admin-chat {
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 6;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: min(360px, calc(100vw - 32px));
            padding: 12px;
            color: white;
            background: rgba(0, 0, 0, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 8px;
        }

        #admin-chat[hidden] {
            display: none;
        }

        #admin-chat-messages {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-height: 180px;
            overflow-y: auto;
            overflow-wrap: anywhere;
            font-size: 14px;
        }

        #admin-chat-form {
            display: flex;
            gap: 6px;
        }

        #admin-chat-input {
            flex: 1;
            min-width: 0;
            padding: 8px;
        }

        #admin-chat-form button {
            padding: 8px 12px;
            cursor: pointer;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        #screen-error {
            padding: 24px;
            color: #fff;
            white-space: pre-wrap;
        }

        @media (max-height: 700px) {
            #menu-screen {
                justify-content: flex-start;
            }
        }
    </style>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
    </script>
</head>
<body>
    <main id="screen-root"></main>
    <script type="module" src="./app.js"></script>
</body>
</html>
