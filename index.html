<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>LabEx Sim</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #111;
        }

        #menu {
            position: fixed;
            inset: 0;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: #111;
            color: white;

            z-index: 10;
        }

        #menu h1 {
            font-size: 64px;
            margin: 0 0 40px;
        }

        #play {
            font-size: 28px;
            padding: 15px 60px;

            border: none;
            border-radius: 8px;

            cursor: pointer;
        }

        #play:hover {
            background: #ddd;
        }

        #game {
            display: none;
            width: 100vw;
            height: 100vh;
        }

        #status {
            position: fixed;
            top: 10px;
            left: 10px;

            color: white;
            background: rgba(0,0,0,0.6);

            padding: 8px 12px;

            z-index: 5;
        }
    </style>
</head>

<body>

<div id="menu">
    <h1>LABEX SIM</h1>
    <button id="play">PLAY</button>
</div>

<div id="game"></div>

<div id="status">
    Not connected
</div>

<script type="module" src="code.js"></script>

</body>
</html>
